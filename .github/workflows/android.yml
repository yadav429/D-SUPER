name: D-SUPER Android APK

on:
  push:
    branches:
      - main
      - feature/hybrid-ai-brain
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=AI_API_BASE_URL="${{ vars.AI_API_BASE_URL }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: D-SUPER-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
