name: D-SUPER Android APK

on:
  push:
    branches:
      - main
      - feature/hybrid-ai-brain
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android platform files
        shell: bash
        run: |
          if [ ! -f android/gradlew ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/d-super-AndroidManifest.xml
            flutter create --platforms=android --project-name d_super .
            cp /tmp/d-super-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Set Android compile SDK to API 36
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          target = next((p for p in candidates if p.exists()), None)
          if target is None:
              raise SystemExit("Android app Gradle file not found")
          source = target.read_text()
          updated, count = re.subn(
              r'(?m)^(\\s*compileSdk(?:Version)?\\s*(?:=\\s*)?)(?:flutter\\.compileSdkVersion|\\d+)',
              r'\\g<1>36',
              source,
          )
          if count == 0:
              raise SystemExit("Could not find compileSdk declaration to update")
          target.write_text(updated)
          print(f"Updated {target} compileSdk to 36")
          PY
          sdkmanager "platforms;android-36"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=AI_API_BASE_URL="${{ vars.AI_API_BASE_URL }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: D-SUPER-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
