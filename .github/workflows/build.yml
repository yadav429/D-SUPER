name: D-SUPER Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Platforms
        run: flutter create --platforms=android,windows --project-name d_super .

      - name: Add Fingerprint Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n'
          if permission not in s:
              s = s.replace('<application', permission + '<application', 1)
          p.write_text(s)
          PY

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: D-SUPER-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows EXE
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Platforms
        run: flutter create --platforms=android,windows --project-name d_super .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath D-SUPER-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: D-SUPER-Windows
          path: D-SUPER-Windows.zip
